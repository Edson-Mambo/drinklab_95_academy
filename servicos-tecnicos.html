<!doctype html><html lang="pt-MZ"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><meta name="description" content="Solicitação de serviços técnicos DrinkLab 95 — manutenção, calibragem, grinders, máquinas de espresso e setup de Coffee Shop."><title>Serviços Técnicos | DrinkLab 95</title><link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg"><link rel="stylesheet" href="assets/css/style.css"><style>.service-page{min-height:100vh;padding:120px 7vw 80px;background:#050505}.service-head{max-width:900px;margin:0 auto 45px;text-align:center}.service-head h1{font-family:Georgia,serif;font-size:clamp(38px,6vw,72px);margin:12px 0}.service-head p{max-width:720px;margin:0 auto;line-height:1.8}.service-options{max-width:1050px;margin:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.service-option{border:1px solid rgba(212,175,55,.28);background:rgba(255,255,255,.025);padding:28px;text-align:left;cursor:pointer;transition:.25s}.service-option:hover,.service-option.active{border-color:#d4af37;transform:translateY(-3px)}.service-option small{display:block;letter-spacing:.16em;opacity:.55;margin-bottom:18px}.service-option h2{margin:0 0 10px;font-family:Georgia,serif}.service-option p{line-height:1.7;opacity:.75}.service-form{max-width:1050px;margin:30px auto 0;padding:35px;border:1px solid rgba(212,175,55,.25);background:rgba(255,255,255,.025)}.service-form h2{font-family:Georgia,serif}.check-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0 25px}.check{display:flex;gap:10px;align-items:flex-start;padding:13px;border:1px solid rgba(255,255,255,.1);line-height:1.4}.check input{margin-top:4px;accent-color:#d4af37}.service-form label.field{display:grid;gap:8px;margin:18px 0}.service-form input,.service-form textarea{width:100%;padding:14px;background:#0d0d0d;border:1px solid rgba(255,255,255,.14);color:#fff}.service-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.service-actions button,.service-actions a{padding:14px 20px;border:1px solid #d4af37;background:#d4af37;color:#050505;text-decoration:none;font-weight:700;cursor:pointer}.service-actions a{background:transparent;color:#d4af37}.notice{margin-top:18px;line-height:1.6}.back-home{position:absolute;top:28px;left:7vw;color:#d4af37;text-decoration:none}@media(max-width:700px){.service-page{padding:90px 5vw 50px}.service-options,.check-grid{grid-template-columns:1fr}.service-form{text-align:justify;padding:22px}.service-form label.field{text-align:left}}</style></head><body><main class="service-page"><a class="back-home" href="./">← DrinkLab 95</a><section class="service-head"><p class="eyebrow">DRINKLAB 95 • SERVIÇOS TÉCNICOS</p><h1>Setup &amp; Serviços Técnicos de Café</h1><p>Escolha o tipo de serviço que necessita. Dentro de cada área poderá selecionar os trabalhos pretendidos e explicar qualquer necessidade adicional.</p></section><section class="service-options"><button class="service-option active" data-type="Manutenção de máquinas e equipamentos" type="button"><small>01</small><h2>Manutenção</h2><p>Limpeza, higienização, backflushing, manutenção preventiva, manutenção corretiva, diagnóstico e reparação.</p></button><button class="service-option" data-type="Assistência de grinder, moagem e dosagem" type="button"><small>02</small><h2>Grinder &amp; Dosagem</h2><p>Calibragem do grinder, ajuste da moagem, dose, rendimento, consistência e assistência na extração.</p></button><button class="service-option" data-type="Máquina de espresso e calibragem" type="button"><small>03</small><h2>Máquina de Espresso</h2><p>Calibragem, pressão, temperatura, extração, grupos, duchas, filtros, porta-filtros e avaliação técnica.</p></button><button class="service-option" data-type="Setup de Coffee Shop" type="button"><small>04</small><h2>Setup de Coffee Shop</h2><p>Definição da estação de café, posicionamento dos equipamentos, fluxo de trabalho e configuração operacional.</p></button><button class="service-option" data-type="Diagnóstico e consultoria técnica" type="button"><small>05</small><h2>Diagnóstico &amp; Consultoria</h2><p>Identificação de problemas, avaliação de equipamentos, recomendações técnicas e otimização da operação.</p></button><button class="service-option" data-type="Manutenção geral de equipamentos" type="button"><small>06</small><h2>Manutenção Geral</h2><p>Serviços técnicos complementares relacionados com equipamentos e funcionamento da estação de café.</p></button></section><section class="service-form"><p class="eyebrow" id="selectedType">01 · MANUTENÇÃO</p><h2>Selecione os serviços pretendidos</h2><form id="serviceRequest"><div id="checkGrid" class="check-grid"></div><label class="field">Nome completo<input name="nome" required></label><label class="field">Telefone / WhatsApp<input name="telefone" required placeholder="+258..."></label><label class="field">E-mail<input name="email" type="email" required></label><label class="field">Nome do estabelecimento (opcional)<input name="estabelecimento"></label><label class="field">Descreva a necessidade ou observações<textarea name="observacoes" rows="6" placeholder="Ex.: modelo da máquina, grinder, problema identificado, serviço desejado, localização, etc."></textarea></label><input type="hidden" name="categoria" id="categoryInput" value="Manutenção de máquinas e equipamentos"><div class="service-actions"><button type="submit">Enviar solicitação</button><a href="./">Voltar ao site</a></div><p class="notice" id="notice"></p></form></section></main><script>const categories={"Manutenção de máquinas e equipamentos":["Limpeza e higienização técnica","Backflushing / limpeza do grupo","Manutenção preventiva","Manutenção corretiva / reparação","Diagnóstico técnico","Limpeza de duchas, filtros e porta-filtros","Verificação geral da máquina"],"Assistência de grinder, moagem e dosagem":["Calibragem do grinder","Ajuste da moagem","Ajuste da dosagem","Ajuste do rendimento / dose","Regulação para espresso","Diagnóstico de moagem inconsistente","Limpeza e manutenção do grinder"],"Máquina de espresso e calibragem":["Calibragem da máquina","Verificação de pressão","Verificação de temperatura","Ajuste de extração","Avaliação de grupos e duchas","Avaliação de filtros e porta-filtros","Diagnóstico de desempenho"],"Setup de Coffee Shop":["Definição do setup da estação de café","Posicionamento de máquina e grinders","Definição do fluxo de trabalho","Organização da bancada","Definição de equipamentos necessários","Otimização de produtividade","Consultoria para abertura / reorganização"],"Diagnóstico e consultoria técnica":["Diagnóstico técnico no local","Avaliação de equipamentos","Identificação de falhas","Recomendação de manutenção","Otimização da operação","Consultoria personalizada"],"Manutenção geral de equipamentos":["Manutenção de equipamentos de café","Limpeza técnica","Inspeção preventiva","Reparação / manutenção corretiva","Diagnóstico geral","Outro serviço técnico"]};let current="Manutenção de máquinas e equipamentos";const options=document.querySelectorAll('.service-option'),grid=document.querySelector('#checkGrid'),type=document.querySelector('#selectedType'),category=document.querySelector('#categoryInput');function render(t){current=t;category.value=t;type.textContent='SERVIÇO · '+t.toUpperCase();grid.innerHTML=categories[t].map((x,i)=>`<label class="check"><input type="checkbox" name="servicos" value="${x.replaceAll('"','&quot;')}"> <span>${x}</span></label>`).join('')}options.forEach(o=>o.addEventListener('click',()=>{options.forEach(x=>x.classList.remove('active'));o.classList.add('active');render(o.dataset.type)}));render(current);document.querySelector('#serviceRequest').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.target),selected=[...document.querySelectorAll('input[name=servicos]:checked')].map(x=>x.value);if(!selected.length){alert('Selecione pelo menos um serviço.');return}const obj={nome:fd.get('nome'),telefone:fd.get('telefone'),email:fd.get('email'),estabelecimento:fd.get('estabelecimento')||'Não informado',categoria:current,servicos:selected.join(', '),observacoes:fd.get('observacoes')||'Nenhuma'};const notice=document.querySelector('#notice'),btn=e.target.querySelector('button[type=submit]');btn.disabled=true;notice.textContent='A enviar a solicitação...';try{const response=await fetch('https://formsubmit.co/ajax/edsonmambo@hotmail.com',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({"_subject":"Nova solicitação de serviço técnico — DrinkLab 95",_template:'table',_captcha:'false',...obj})});if(!response.ok)throw new Error('Falha no envio');const wa=encodeURIComponent(`Nova solicitação de serviço técnico — DrinkLab 95\n\nCategoria: ${obj.categoria}\nServiços: ${obj.servicos}\nNome: ${obj.nome}\nTelefone: ${obj.telefone}\nE-mail: ${obj.email}\nEstabelecimento: ${obj.estabelecimento}\nObservações: ${obj.observacoes}`);notice.textContent='Solicitação enviada por e-mail. A abrir o WhatsApp para envio dos mesmos dados...';window.open(`https://wa.me/25884862987766?text=${wa}`,'_blank');e.target.reset();document.querySelectorAll('.service-option').forEach(x=>x.classList.remove('active'));document.querySelector('.service-option').classList.add('active');render(current)}catch(err){console.error(err);notice.textContent='Não foi possível enviar o e-mail automaticamente. Tente novamente ou contacte-nos pelo WhatsApp.';window.open(`https://wa.me/25884862987766?text=${encodeURIComponent('Solicitação de serviço técnico DrinkLab 95 — por favor, preciso de assistência.')}`,'_blank')}finally{btn.disabled=false}});</script></body></html>
