<!doctype html><html lang="pt-MZ"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DrinkLab 95 — Publicações</title><link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg"><link rel="stylesheet" href="assets/css/style.css"><style>.posts-page{max-width:1100px;margin:auto;padding:45px 18px 80px}.posts-head{text-align:center;margin-bottom:35px}.posts-head h1{font-family:'Playfair Display',serif;font-size:clamp(34px,6vw,58px)}.posts-head p{color:#aaa49b}.posts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.post{background:linear-gradient(145deg,#15120d,#080808);border:1px solid #3b2d1b;border-radius:14px;overflow:hidden}.post-media{width:100%;max-height:520px;display:block;object-fit:cover;background:#050505}.post-body{padding:22px}.post-meta{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#c9973d}.post h2{font-family:'Playfair Display',serif;font-size:25px;margin:9px 0}.post p{color:#aaa49b;line-height:1.8;white-space:pre-line}.empty{grid-column:1/-1;text-align:center;color:#777;padding:60px 20px;border:1px dashed #3b2d1b;border-radius:14px}.back{display:inline-block;color:#c9973d;text-decoration:none;margin-bottom:25px}@media(max-width:750px){.posts-grid{grid-template-columns:1fr}}</style></head><body><header><a href="./"><img src="assets/logo/drinklab-95.svg" alt="DrinkLab 95"></a><span>PUBLICAÇÕES</span></header><main class="posts-page"><a class="back" href="./acesso.html">← Voltar ao Portal</a><section class="posts-head"><p class="eyebrow" id="eyebrow">PUBLICAÇÕES</p><h1 id="pageTitle">Anúncios</h1><p id="pageDesc">Publicações dos formadores e da Administração.</p></section><section id="posts" class="posts-grid"><div class="empty">A carregar publicações...</div></section></main><script>const SUPABASE_URL='https://tkdqmpmiunkupmmumxmk.supabase.co',SUPABASE_KEY='sb_publishable_qCKY-QilEX5M3-k2R3CfyQ_MfSv4UKz';const names={academy:'DrinkLab Academy',danca:'Academia de Dança',scorpion:'Scorpion Service'};const params=new URLSearchParams(location.search),area=params.get('area')||'all';document.querySelector('#pageTitle').textContent=names[area]||'Recentemente Criado';document.querySelector('#pageDesc').textContent=area==='all'?'Publicações mais recentes das três áreas.':`Anúncios, informações, fotos e vídeos de ${names[area]}.`;function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function load(){const box=document.querySelector('#posts');try{const url=area==='all'?`${SUPABASE_URL}/rest/v1/posts?select=*&published=eq.true&order=created_at.desc`: `${SUPABASE_URL}/rest/v1/posts?select=*&area=eq.${encodeURIComponent(area)}&published=eq.true&order=created_at.desc`;const res=await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});if(!res.ok)throw new Error(await res.text());const posts=await res.json();box.innerHTML=posts.length?posts.map(p=>{let media='';if(p.media_url&&p.media_type==='image')media=`<img class="post-media" src="${esc(p.media_url)}" alt="${esc(p.title)}">`;else if(p.media_url&&p.media_type==='video')media=`<video class="post-media" controls preload="metadata" src="${esc(p.media_url)}"></video>`;return `<article class="post">${media}<div class="post-body"><div class="post-meta">${esc(p.author_name||'DrinkLab 95')} · ${new Date(p.created_at).toLocaleString('pt-MZ')}</div><h2>${esc(p.title)}</h2><p>${esc(p.content)}</p></div></article>`}).join(''):'<div class="empty">Ainda não existem publicações nesta área.</div>'}catch(e){console.error(e);box.innerHTML='<div class="empty">Não foi possível carregar as publicações. Tente novamente mais tarde.</div>'}}load();setInterval(load,30000);</script></body></html>
