<!doctype html><html lang="pt-MZ"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DrinkLab 95 — Publicações</title><link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg"><link rel="stylesheet" href="assets/css/style.css"><style>.posts-page{max-width:1100px;margin:auto;padding:45px 18px 80px}.posts-head{text-align:center;margin-bottom:35px}.posts-head h1{font-family:'Playfair Display',serif;font-size:clamp(34px,6vw,58px)}.posts-head p{color:#aaa49b}.posts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.post{background:linear-gradient(145deg,#15120d,#080808);border:1px solid #3b2d1b;border-radius:14px;overflow:hidden}.post-media{width:100%;max-height:520px;display:block;object-fit:cover;background:#050505}.post-body{padding:22px}.post-meta{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#c9973d}.post-author{font-size:11px;color:#e4bb68;margin:8px 0 10px}.post h2{font-family:'Playfair Display',serif;font-size:25px;margin:9px 0}.post p{color:#aaa49b;line-height:1.8;white-space:pre-line}.notice-badge{display:inline-block;margin-bottom:8px;padding:5px 9px;border:1px solid #8b6728;border-radius:20px;color:#e4bb68;font-size:9px;letter-spacing:.12em;text-transform:uppercase}.empty{grid-column:1/-1;text-align:center;color:#777;padding:60px 20px;border:1px dashed #3b2d1b;border-radius:14px}.back{display:inline-block;color:#c9973d;text-decoration:none;margin-bottom:25px}@media(max-width:750px){.posts-grid{grid-template-columns:1fr}}</style></head><body><header><a href="./"><img src="assets/logo/drinklab-95.svg" alt="DrinkLab 95"></a><span>PUBLICAÇÕES</span></header><main class="posts-page"><a class="back" href="./acesso.html">← Voltar ao Portal</a><section class="posts-head"><p class="eyebrow" id="eyebrow">PUBLICAÇÕES</p><h1 id="pageTitle">Anúncios</h1><p id="pageDesc">Publicações dos formadores e da Administração.</p></section><section id="posts" class="posts-grid"><div class="empty">A carregar publicações...</div></section></main><script>const SUPABASE_URL='https://tkdqmpmiunkupmmumxmk.supabase.co',SUPABASE_KEY='sb_publishable_qCKY-QilEX5M3-k2R3CfyQ_MfSv4UKz';const names={academy:'DrinkLab Academy',danca:'Academia de Dança',scorpion:'Scorpion Service'};const params=new URLSearchParams(location.search),area=params.get('area')||'all';document.querySelector('#pageTitle').textContent=names[area]||'Publicações';document.querySelector('#pageDesc').textContent=area==='all'?'Publicações mais recentes das três áreas.':`Anúncios, informações, fotos e vídeos de ${names[area]}.`;function esc(v){return String(v??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}function norm(v){return String(v??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}function mapArea(x){const text=norm([x.area,x.category,x.audience,x.title,x.content,x.message].join(' '));if(/danca|dança|dance/.test(text))return'danca';if(/scorpion|bartender|barwoman|coquetelaria|hospitalidade/.test(text))return'scorpion';return'academy'}async function api(path){const r=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});if(!r.ok)throw new Error(await r.text());return r.json()}function author(u){return u.author_name||u.formador_nome||u.trainer_name||u.author_email||u.created_by||u.formador||u.email_formador||'Formador DrinkLab'}function renderPost(p){let media='';if(p.media_url&&p.media_type==='image')media=`<img class="post-media" src="${esc(p.media_url)}" alt="${esc(p.title)}">`;else if(p.media_url&&p.media_type==='video')media=`<video class="post-media" controls preload="metadata" src="${esc(p.media_url)}"></video>`;return `<article class="post">${media}<div class="post-body"><div class="post-meta">${esc(author(p))} · ${new Date(p.created_at).toLocaleString('pt-MZ')}</div><h2>${esc(p.title)}</h2><p>${esc(p.content)}</p></div></article>`}function renderUpdate(u){const type=norm(u.category).includes('aviso')?'Aviso':'Publicação';return `<article class="post"><div class="post-body"><span class="notice-badge">${type}</span><div class="post-meta">${new Date(u.created_at).toLocaleString('pt-MZ')}</div><div class="post-author">Publicado por: <strong>${esc(author(u))}</strong></div><h2>${esc(u.title)}</h2><p>${esc(u.message)}</p></div></article>`}async function load(){const box=document.querySelector('#posts');try{const [posts,updates]=await Promise.all([api('posts?select=*&published=eq.true&order=created_at.desc'),api('trainer_updates?select=*&order=created_at.desc')]);const mappedUpdates=updates.map(u=>({...u,__area:mapArea(u)}));const filteredPosts=area==='all'?posts:posts.filter(p=>mapArea(p)===area);const filteredUpdates=area==='all'?mappedUpdates:mappedUpdates.filter(u=>u.__area===area);const items=[...filteredPosts.map(p=>({date:p.created_at,html:renderPost(p)})),...filteredUpdates.map(u=>({date:u.created_at,html:renderUpdate(u)}))].sort((a,b)=>new Date(b.date)-new Date(a.date));box.innerHTML=items.length?items.map(x=>x.html).join(''):'<div class="empty">Ainda não existem publicações nesta área.</div>'}catch(e){console.error(e);box.innerHTML='<div class="empty">Não foi possível carregar as publicações. Tente novamente mais tarde.</div>'}}load();setInterval(load,15000);</script></body></html>
